<main>
  <header>
    <h1>Cyberlofi Lab</h1>
    <p class="sub">Escolha o estilo, clique em Gerar e copie cada parte.</p>
  </header>

  <section class="controls">
    <div>
      <label for="estilo">Estilo</label>
      <select id="estilo"></select>
    </div>
    <div>
      <label for="duracao">Duração</label>
      <select id="duracao">
        <option value="1 Hour">1 hora</option>
        <option value="2 Hours" selected>2 horas</option>
        <option value="3 Hours">3 horas</option>
        <option value="8 Hours">8 horas (sleep)</option>
        <option value="Single">Faixa única (3–4 min)</option>
      </select>
    </div>
    <div class="full">
      <label for="tema">Tema (opcional, em inglês)</label>
      <input id="tema" type="text" placeholder="Ex: Neon Rainfall, Midnight Tokyo Drive">
    </div>
    <button id="gerar" type="button">Gerar</button>
  </section>

  <div class="bar">
    <span id="info"></span>
    <button class="btn" id="copiarTudo" type="button">Copiar tudo</button>
  </div>

  <div id="saida" style="display:flex; flex-direction:column; gap:1.25rem;"></div>
</main>

const rnd = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const pick = (a, n) => shuffle(a).slice(0, n);
const titleCase = s => s.replace(/\S+/g, w => w[0].toUpperCase() + w.slice(1));
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]/g, '');

function cortar(txt, max) {
  if (txt.length <= max) return txt;
  const c = txt.slice(0, max + 1), i = c.lastIndexOf(' ');
  return (i > max / 2 ? c.slice(0, i) : txt.slice(0, max)).replace(/[\s•|,\-—:]+$/, '');
}

function gerarMusica(cfg, hs, tema, single) {
  const p = [rnd(cfg.audioPrompts), rnd(POOLS.moods), 'strictly instrumental, no lead vocals'];
  if (tema) p.push(`thematic atmosphere inspired by "${tema}"`);
  p.push(rnd(hs.semBateria ? POOLS.timingAmbient : POOLS.timing), ...pick(hs.audioQuirks, 2), rnd(POOLS.room),
         `subtle background sounds: ${pick(hs.foley, 2).join(' and ')}`, rnd(POOLS.mix));
  const neg = POOLS.audioNeg + ', no vocals, no choir' + (hs.semBateria ? ', no drums, no percussion' : '');
  return { texto: p.join(', ') + (single ? POOLS.estruturaSingle : POOLS.estruturaLonga), neg };
}

  const imperf = POOLS.filmImperf.filter(i => !(/halation/.test(hs.film) && /halation/.test(i)));

function gerarTitulos(cfg, tema, durKey) {
  const dur = durKey === 'Single' ? '' : durKey;
  const e = cfg.emoji, kw = cfg.kw;
  const paren = dur ? ` (${dur})` : '', dot = dur ? ` · ${dur}` : '';
  const grupos = [
    shuffle(cfg.titulos).flatMap(n => [dur ? `${dur} of ${kw} ${e} ${n}` : `${kw} ${e} ${n}`, `${n} ${e} ${kw}${dot}`]),
    [`POV: ${cfg.pov} ${e} ${kw}`],
    [`Best ${kw} Mix for ${cfg.use}${paren}`, `${kw} for ${cfg.use}${paren} ${e}`]
  ];
  if (tema) { const t = titleCase(tema); grupos.unshift([`${t} ${e} ${kw}${dot}`, dur ? `${dur} of ${t} ${e} ${kw}` : `${t} ${e} ${kw}`]); }
  const out = [];
  for (const g of grupos) {
    const ok = g.filter(t => t.length <= 60);
    if (ok.length) out.push(rnd(ok));
    if (out.length === 3) break;
  }
  if (!out.length) out.push(cortar(grupos[0][0], 60));
  return out;
}

function tempo(seg) {
  const h = Math.floor(seg / 3600), m = Math.floor(seg % 3600 / 60), s = seg % 60;
  return (h ? h + ':' : '') + (h ? String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}

function capitulos(cfg, durKey) {
  const min = DUR[durKey];
  if (!min) return '';
  const total = min * 60, longo = min >= 480, usados = new Set(), linhas = [];
  let t = 0, i = 1;
  while (t < total - 120) {
    let nome = '';
    for (let k = 0; k < 30; k++) { nome = `${rnd(cfg.trackWords.a)} ${rnd(cfg.trackWords.b)}`; if (!usados.has(nome)) break; }
    if (usados.has(nome)) nome += ` ${i}`;
    usados.add(nome);
    linhas.push(`${tempo(t)} ${longo ? `Part ${i} · ${nome}` : nome}`);
    t += longo ? 1800 : 170 + Math.floor(Math.random() * 70);
    i++;
  }
  return linhas.join('\n');
}

function gerarDescricao(cfg, tema, durKey) {
  const dur = durKey === 'Single' ? '' : durKey;
  const base = cfg.hashYT.filter(h => h.toLowerCase() !== '#cyberlofilab');
  const s = slug(tema);
  const vistos = new Set(), tags = [];
  [base[0], base[1], ...(s && s.length <= 22 ? ['#' + s] : []), ...base.slice(2)].forEach(h => {
    if (h && !vistos.has(h.toLowerCase())) { vistos.add(h.toLowerCase()); tags.push(h); }
  });
  const hashtags = [...tags.slice(0, 5), '#CyberlofiLab'].join(' ');
  const L = [`🎧 ${dur ? dur + ' of ' : ''}${cfg.kw} — ${cfg.leadEN}`];
  if (tema) L.push(`Inspired by "${tema}".`);
  L.push('', 'Perfect for:', ...cfg.usosEN.map(u => `• ${u}`));
  const cap = capitulos(cfg, durKey);
  if (cap) L.push('', '⏱️ Tracklist:', cap);
  L.push('', '👍 Like · 🔔 Subscribe for a new mix every week', `💬 ${cfg.question}`, '', '🎧 Curated by Cyberlofi Lab.', '', hashtags);
  return L.join('\n');
}

// ---------- Tags ----------
function gerarTags(cfg, tema, durKey) {
  const base = [];
  if (tema) base.push(tema.toLowerCase());
  if (durKey !== 'Single') base.push(`${durKey} ${cfg.kw}`.toLowerCase());
  base.push(...cfg.tags, cfg.nome.toLowerCase());
  const vistos = new Set(), out = [];
  let len = 0;
  for (const t of base) {
    const c = t.trim().replace(/#/g, '');
    if (!c || vistos.has(c.toLowerCase())) continue;
    vistos.add(c.toLowerCase());
    const inc = c.length + (out.length ? 2 : 0);
    if (len + inc > 500) break;
    out.push(c); len += inc;
  }
  return out.join(', ');
}

// ---------- Interface ----------
function autoajustar(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }

function setTexto(id, valor) {
  const t = $(id);
  t.value = valor;
  autoajustar(t);
}

async function copiarTexto(texto, btn) {
  if (!texto) return;
  const original = btn.textContent;
  let ok = false;
  try { await navigator.clipboard.writeText(texto); ok = true; }
  catch (e) {
    const tmp = document.createElement('textarea');
    tmp.value = texto; tmp.style.cssText = 'position:fixed;opacity:0;';
    document.body.appendChild(tmp); tmp.select();
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    document.body.removeChild(tmp);
  }
  btn.textContent = ok ? 'Copiado ✓' : 'Falhou ✗';
  setTimeout(() => { btn.textContent = original; }, 1300);
}

function criarCampo(id, rotulo, rows, extra) {
  const wrap = document.createElement('div');
  wrap.className = extra ? 'extra small' : 'campo';
  const head = document.createElement('div');
  head.className = 'head';
  const l = document.createElement(extra ? 'label' : 'h2');
  l.textContent = rotulo;
  if (extra) l.style.marginBottom = '0';
  const b = document.createElement('button');
  b.className = 'btn'; b.type = 'button'; b.textContent = 'Copiar';
  b.addEventListener('click', () => copiarTexto($(id).value, b));
  head.append(l, b);
  const t = document.createElement('textarea');
  t.id = id; t.rows = rows;
  t.addEventListener('input', () => autoajustar(t));
  wrap.append(head, t);
  return wrap;
}

function montarTela() {
  const sel = $('estilo');
  const alea = document.createElement('option');
  alea.value = 'random'; alea.textContent = '🎲 Aleatório';
  sel.appendChild(alea);
  Object.keys(ESTILOS).forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = `${ESTILOS[k].emoji} ${ESTILOS[k].kw}`;
    sel.appendChild(o);
  });

  CAMPOS.forEach(c => {
    const box = document.createElement('section');
    box.className = 'box';
    box.appendChild(criarCampo(c.id, c.titulo, c.rows, false));
    if (c.extra) box.appendChild(criarCampo(c.extra.id, c.extra.rotulo, 2, true));
    $('saida').appendChild(box);
  });
}

function gerar() {
  const escolha = $('estilo').value;
  const key = escolha === 'random' ? rnd(Object.keys(ESTILOS)) : escolha;
  const cfg = ESTILOS[key], hs = HUMANO[key];
  const sc = CENARIOS[rnd(cfg.cenariosIdeais)];
  const durKey = $('duracao').value;
  const tema = $('tema').value.trim();

  const musica = gerarMusica(cfg, hs, tema, durKey === 'Single');
  const thumb = gerarThumb(cfg, sc, hs, tema, durKey);

  setTexto('musica', musica.texto);
  setTexto('musicaNeg', musica.neg);
  setTexto('imagem', gerarImagem(sc, hs, tema));
  setTexto('imagemNeg', POOLS.imagemNeg);
  setTexto('thumb', thumb.prompt);
  setTexto('thumbTexto', thumb.texto);
  setTexto('titulo', gerarTitulos(cfg, tema, durKey).join('\n'));
  setTexto('descricao', gerarDescricao(cfg, tema, durKey));
  setTexto('tags', gerarTags(cfg, tema, durKey));

  $('info').textContent = `${cfg.emoji} ${cfg.nome}`;
}

function copiarTudo(btn) {
  const partes = CAMPOS.map(c => {
    let t = `${c.titulo.toUpperCase()}\n${$(c.id).value}`;
    if (c.extra) t += `\n\n${c.extra.rotulo.toUpperCase()}\n${$(c.extra.id).value}`;
    return t;
  });
  copiarTexto(partes.join('\n\n--------------------\n\n'), btn);
}

montarTela();
$('gerar').addEventListener('click', gerar);
$('copiarTudo').addEventListener('click', e => copiarTudo(e.currentTarget));
gerar();
</script>
